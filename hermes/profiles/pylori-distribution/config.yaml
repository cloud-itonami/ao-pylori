dashboard:
  turn_isolation: true
tts:
  provider: nous
wake_word:
  enabled: false
moa:
  presets:
    default:
      reference_models:
        - provider: kotoba
          model: qwen3.8-27b-whitehacker
          enabled: true
      aggregator:
        provider: opencode-free
        model: deepseek-v4-flash-free
      degraded_reference_policy: loud
      fanout: user_turn
      enabled: false
  reference_models:
    - provider: kotoba
      model: qwen3.8-27b-whitehacker
      enabled: true
  aggregator:
    provider: opencode-free
    model: deepseek-v4-flash-free
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  trusted_project_dirs:
    - /Users/junkawasaki/github/com-junkawasaki/root
command_allowlist:
  - shell execution via heredoc
  - recursive delete
  - overwrite project env/config via redirection
  - delete in root path
  - overwrite project env/config file
  - overwrite system file via redirection
  - script execution via heredoc
  - script execution via -e/-c flag
  - stop/restart hermes gateway (kills running agents)
  - git force push (rewrites remote history)
  - command parser limit or malformed executable payload
plugins:
  enabled: []
gateway:
  cron_only: true
  multiplex_profiles: true
secrets:
  command:
    enabled: true
    command: printf 'OPENROUTER_API_KEY=%s\n' "$(security find-generic-password -s gftd.openrouter -w)"
    helper_timeout_seconds: 10
    override_existing: true
_config_version: 51
image_gen:
  provider: nous
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
agent:
  max_turns: 500
  run_budget_seconds: 1800

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

cron:
  max_parallel_jobs: 12
terminal:
